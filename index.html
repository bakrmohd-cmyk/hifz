}
:root[data-theme="dark"] {

  --accent: #9db2ff; --accent-fg: #11151f; --accent-soft: #2c3658; --err: #f2b8b5;
  --c0: #ef6a62; --c1: #f29a43; --c2: #eecb3d; --c3: #4fbb78;

* { box-sizing: border-box; }

.chip { flex: none; font: inherit; font-size: calc(14px * var(--fs, 1)); font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 10px; cursor: pointer; min-height: 40px; }

.row { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; }
.row .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; font: inherit; color: inherit; text-align: start; padding: 8px 12px; cursor: pointer; min-height: 52px; }

.minus { flex: none; width: 40px; height: 40px; margin-inline-end: 6px; border-radius: 50%; border: 0; background: transparent; color: var(--fg); font-size: calc(22px * var(--fs, 1)); cursor: pointer; }
.minus:hover { background: var(--surface2); }

.btn.filled { background: var(--accent); color: var(--accent-fg); }

.btn.text { background: none; color: var(--accent); padding: 8px 10px; }
.empty { text-align: center; padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty h2 { margin: 0; font-size: calc(1.3rem * var(--fs, 1)); } .empty p { margin: 0; color: var(--muted); max-width: 32ch; }
.fab { position: fixed; inset-inline-end: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; font: inherit; font-weight: 600; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 16px; padding: 16px 20px; box-shadow: 0 3px 10px rgba(0,0,0,.25); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 82vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet h2 { font-size: calc(1.15rem * var(--fs, 1)); margin: 0; padding: 18px 16px 8px; }
.sheet .list { overflow-y: auto; padding: 0 16px; flex: 1; }
.sheet .item { padding-bottom: 12px; }
.sheet .item-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet .item-h b { font-size: calc(14px * var(--fs, 1)); }
.fchip { font: inherit; font-size: calc(14px * var(--fs, 1)); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; min-height: 40px; }
.fchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.sheet .foot { padding: 12px 16px; } .sheet .foot .btn { width: 100%; }
.confirm { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: calc(14px * var(--fs, 1)); }
.confirm .acts { display: flex; gap: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: calc(13px * var(--fs, 1)); font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.hcard { border: 1px solid var(--line); background: var(--surface2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.hcard-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.hcard-top b { font-size: calc(1rem * var(--fs, 1)); }
.hcard-sub { display: flex; align-items: center; gap: 8px; font-size: calc(12px * var(--fs, 1)); color: var(--muted); flex-wrap: wrap; }
.hcard-sub .pips { margin: 0; min-height: 0; }
.wp { display: flex; flex-direction: column; gap: 4px; }
.wp label { font-size: calc(12px * var(--fs, 1)); font-weight: 600; color: var(--muted); }
.wp input { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-height: 42px; }
.wp input::placeholder { color: var(--muted); opacity: .8; }
.stats5 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid .grp-h { grid-column: 1 / -1; padding: 6px 2px 0; font-size: calc(14px * var(--fs, 1)); }
.tile { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }

/* ---------- Alternative styles (set after the theme blocks so they win) ---------- */
:root[data-skin] .card, :root[data-skin] .tile, :root[data-skin] .row, :root[data-skin] .chip, :root[data-skin] .fchip, :root[data-skin] .hcard { border-radius: var(--r); }
:root[data-skin] .tile input, :root[data-skin] .btn.outline { border-radius: var(--r2); }

/* Minimal: white, hairlines, square corners; status shown as a colour bar */
:root[data-skin="minimal"] {
  --bg: #ffffff; --surface: #ffffff; --surface2: #ffffff; --fg: #111111; --muted: #6b6b6b; --line: #e2e2e2;
  --accent: #111111; --accent-fg: #ffffff; --accent-soft: #f0f0f0; --err: #c62828;
  --c0: #e5484d; --c1: #f5a524; --c2: #e0b400; --c3: #30a46c;
  --t0: transparent; --t1: transparent; --t2: transparent; --t3: transparent;
  --r: 2px; --r2: 2px; color-scheme: light;
}
:root[data-skin="minimal"] .tile, :root[data-skin="minimal"] .row { border-color: var(--line) !important; background: var(--surface) !important; border-inline-start: 5px solid var(--lc, var(--line)) !important; }
:root[data-skin="minimal"] .chip[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
:root[data-skin="minimal"] .fab { box-shadow: none; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); border-radius: 2px; }
:root[data-skin="minimal"] .grp-h { text-transform: none; letter-spacing: .02em; }
/* ---------- Shared bits ---------- */
.skinsel { appearance: none; -webkit-appearance: none; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 150px; color: var(--accent); }
.skinsel option { color: #111; background: #fff; }
.wline { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; font-size: calc(12px * var(--fs, 1)); min-height: 32px; padding: 6px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.wline .wk { color: var(--muted); flex: none; }
.wline .wv { font-weight: 600; min-width: 0; flex: 1 1 auto; overflow-wrap: break-word; }
.wline.has { border-inline-start: 4px solid var(--c0); }
.rcell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rcell input { font: inherit; font-size: calc(13px * var(--fs, 1)); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 34px; width: 100%; min-width: 0; }
.rcell input.has { border-inline-start: 4px solid var(--c0); }
.rcell input::placeholder { color: var(--muted); opacity: .85; }
:root[data-skin] .wline, :root[data-skin] .rcell input { border-radius: var(--r2); }

/* Soft: pillowy, borderless boxes with shadows and generous rounding */
:root[data-skin="soft"] {
  --bg: #e8edf5; --surface: #ffffff; --surface2: #f4f6fb; --fg: #1d2540; --muted: #6a7391; --line: #dde3ef;
  --accent: #5566ee; --accent-fg: #ffffff; --accent-soft: #e0e4ff; --err: #c8333d;
  --c0: #ee6770; --c1: #f5a050; --c2: #efcb4b; --c3: #46bd85;
  --t0: rgba(238,103,112,.2); --t1: rgba(245,160,80,.22); --t2: rgba(239,203,75,.28); --t3: rgba(70,189,133,.2);
  --font: "Nunito", "Noto Naskh Arabic", system-ui, sans-serif; --r: 22px; --r2: 14px; color-scheme: light;
}
:root[data-skin="soft"] .card, :root[data-skin="soft"] .tile, :root[data-skin="soft"] .row { border-color: transparent !important; box-shadow: 0 3px 12px rgba(44,60,110,.12); }
:root[data-skin="soft"] .chip { border-color: transparent; box-shadow: 0 2px 6px rgba(44,60,110,.1); border-radius: 999px; }
:root[data-skin="soft"] .chip[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
:root[data-skin="soft"] .wline, :root[data-skin="soft"] .rcell input { border-color: transparent; border-radius: 999px; padding-inline: 12px; background: rgba(255,255,255,.8); }
:root[data-skin="soft"] .wline.has, :root[data-skin="soft"] .rcell input.has { border-inline-start: 0; box-shadow: inset 0 0 0 2px var(--c0); }
:root[data-skin="soft"] .btn.filled, :root[data-skin="soft"] .fab { background: var(--accent); color: var(--accent-fg); }
:root[data-skin="soft"] .grp-h { padding-inline: 6px; }

/* Blocks: solid colour-block tiles, the colour is the status */
:root[data-skin="blocks"] {
  --bg: #eceef2; --surface: #ffffff; --surface2: #dfe2e8; --fg: #10141f; --muted: #555d70; --line: #d3d7df;

  --r: 6px; --r2: 4px; color-scheme: light;
}
:root[data-skin="blocks"] body { font-weight: 500; }

:root[data-skin="blocks"] .tile b, :root[data-skin="blocks"] .row b { font-weight: 800; }
:root[data-skin="blocks"] .row .main { color: var(--lx); }
:root[data-skin="blocks"] .row .main small { color: inherit; opacity: .85; }

:root[data-skin="blocks"] .tile .pip.on { background: currentColor; opacity: 1; }
:root[data-skin="blocks"] .tile .wline { background: rgba(255,255,255,.28); border-color: transparent; color: inherit; }
:root[data-skin="blocks"] .tile .wline .wk { color: inherit; opacity: .8; }
:root[data-skin="blocks"] .tile .wline.has { border-inline-start-color: var(--lx); }
:root[data-skin="blocks"] .meter i:not([style]) { background: rgba(0,0,0,.18); }
:root[data-skin="blocks"] .meter i[style] { background: var(--lx) !important; }
:root[data-skin="blocks"] .chip[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
:root[data-skin="blocks"] .fab { background: var(--fg); color: var(--bg); box-shadow: none; border-radius: 6px; }
:root[data-skin="blocks"] .rcell input.has { border-inline-start-color: var(--c0); }
/* ---------- v2: text size, profiles, settings ---------- */
:root[data-size="1"] { --fs: 1.2; }
:root[data-size="2"] { --fs: 1.4; }
